{% extends "base.html" %}
{% block body %}
<h2>全部记录</h2>
<p class="muted">该页面仅供人工核对；报送后台只通过查询页和录入页操作。</p>
<table id="all-records">
  <thead><tr><th>记录编号</th><th>样本号</th><th>项目</th><th>结果</th><th>录入时间</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td class="remote-id">{{ r.id }}</td>
      <td>{{ r.sample_no }}</td>
      <td>{{ r.project }}</td>
      <td class="remote-result">{{ r.result }}</td>
      <td>{{ r.created_at }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}

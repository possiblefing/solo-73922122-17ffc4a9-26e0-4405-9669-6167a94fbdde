<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{% block title %}旧水质报送站{% endblock %}</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f5f7; color: #1f2933; }
    header { background: #243b53; color: #fff; padding: 14px 24px; }
    header a { color: #bcccdc; margin-right: 16px; text-decoration: none; }
    header .badge { background: #b91c1c; padding: 3px 10px; border-radius: 10px; font-size: 12px; }
    header .badge.off { background: #2f855a; }
    main { max-width: 880px; margin: 24px auto; background: #fff; padding: 24px 32px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    th, td { border: 1px solid #d9e2ec; padding: 8px 10px; text-align: left; }
    th { background: #f0f4f8; }
    input { padding: 8px; border: 1px solid #9fb3c8; border-radius: 4px; margin: 4px 8px 12px 0; }
    button { padding: 8px 18px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    button.warn { background: #b45309; }
    .flash { padding: 10px 14px; border-radius: 4px; margin: 12px 0; }
    .flash.err { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .flash.ok { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .muted { color: #627d98; font-size: 13px; }
  </style>
</head>
<body>
<header>
  <strong>旧水质报送站（演示）</strong>
  &nbsp;|&nbsp;
  <a href="/">首页</a><a href="/search">查询</a><a href="/new">录入</a><a href="/records">全部记录</a>
  {% if disconnect %}<span class="badge">断连开关：开（POST 失败）</span>
  {% else %}<span class="badge off">断连开关：关（正常）</span>{% endif %}
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{% block title %}水质结果报送控制台{% endblock %}</title>
  <style>
    :root { --line:#d9e2ec; --ink:#1f2933; }
    body { font-family: "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
           margin:0; background:#f0f4f8; color:var(--ink); }
    header { background:#102a43; color:#fff; padding:14px 28px; }
    header a { color:#bcccdc; text-decoration:none; margin-right:18px; }
    main { max-width:1100px; margin:24px auto; background:#fff; padding:24px 30px;
           border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
    table { border-collapse:collapse; width:100%; margin-top:14px; font-size:14px; }
    th,td { border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top; }
    th { background:#f0f4f8; }
    input[type=file]{ margin:10px 0; }
    button { padding:8px 18px; border:0; border-radius:5px; cursor:pointer;
             background:#2563eb; color:#fff; }
    button.gray { background:#486581; }
    button.red { background:#b91c1c; }
    button:disabled { background:#9fb3c8; cursor:not-allowed; }
    .pill { display:inline-block; padding:2px 10px; border-radius:11px;
            font-size:12px; white-space:nowrap; }
    .PENDING { background:#e4e7eb; color:#334e68; }
    .QUERY_FAILED { background:#fde68a; color:#92400e; }
    .UNVERIFIED { background:#fed7aa; color:#9a3412; }
    .SAVING { background:#bfdbfe; color:#1e40af; }
    .ALREADY_SENT { background:#d1fae5; color:#065f46; }
    .SAVED { background:#bbf7d0; color:#14532d; }
    .CONFLICT { background:#fecaca; color:#991b1b; }
    .batch-RUNNING { background:#dbeafe; color:#1d4ed8; }
    .batch-STOPPED { background:#fef3c7; color:#a16207; }
    .batch-DONE { background:#dcfce7; color:#166534; }
    .flash { padding:10px 14px; border-radius:6px; margin:12px 0; }
    .flash.err { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }
    .flash.info { background:#e0f2fe; color:#075985; border:1px solid #7dd3fc; }
    .muted { color:#627d98; font-size:13px; }
    .counts span { display:inline-block; margin-right:12px; font-size:13px; }
    .shot { max-width:260px; border:1px solid var(--line); border-radius:4px; }
    .row-active { outline:2px solid #2563eb; outline-offset:-2px; }
    code { background:#f0f4f8; padding:1px 5px; border-radius:3px; }
  </style>
</head>
<body>
<header>
  <strong>水质结果报送控制台</strong>
  &nbsp;|&nbsp; <a href="/">批次列表</a>
  <span style="float:right" class="muted">旧站地址由环境变量配置，后台仅经浏览器访问</span>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
